name: Build Binary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # 根据你的项目需求调整 Go 版本

    - name: Tidy and verify
      run: |
        go mod tidy
        
    - name: Build binary
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dhcp_packet main.go
        
    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: dhcp_packet-linux-amd64
        path: dhcp_packet
        retention-days: 30
